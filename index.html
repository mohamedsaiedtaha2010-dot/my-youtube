<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي الاحترافية للفيديوهات</title>
    <style>
        body {
            background-color: #0f0f0f; color: white;
            font-family: sans-serif; margin: 0; padding: 0; direction: rtl;
        }
        .navbar {
            background-color: #0f0f0f; padding: 10px 40px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222; position: fixed; top: 0; width: 100%; box-sizing: border-box; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: bold; }
        .logo span { color: #ff0000; }
        .search-container { flex: 0 1 400px; display: flex; }
        .search-input { width: 100%; padding: 8px 16px; background-color: #121212; border: 1px solid #303030; border-radius: 20px; color: white; font-size: 14px; text-align: right; }
        .add-video-btn { background-color: #ff0000; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .main-content { margin-top: 80px; padding: 20px; }
        .video-container { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 24px; max-width: 1200px; margin: 0 auto; }
        .video-card { background-color: #161616; width: 280px; display: flex; flex-direction: column; border-radius: 12px; padding: 10px; box-sizing: border-box; }
        video { width: 100%; border-radius: 8px; background-color: #000; aspect-ratio: 16 / 9; }
        .video-title { font-size: 15px; margin: 12px 0 6px 0; font-weight: bold; }
        .action-container { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 13px; }
        .like-btn { background-color: #272727; color: white; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; }
        
        /* 🗑️ تصميم زر الحذف الأحمر الصغير */
        .delete-btn { background-color: #272727; color: #ff4d4d; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background-color: #ff0000; color: white; }

        .comments-section { margin-top: 12px; background-color: #0f0f0f; padding: 10px; border-radius: 8px; }
        .comment-input-container { display: flex; gap: 6px; }
        .comment-input { flex: 1; padding: 6px 10px; background-color: #272727; border: 1px solid #3e3e3e; border-radius: 6px; color: white; font-size: 12px; }
        .comment-submit-btn { background-color: #fff; color: #000; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .comments-list { margin-top: 8px; max-height: 80px; overflow-y: auto; font-size: 12px; color: #aaa; }
        .comment-item { padding: 4px 0; border-bottom: 1px solid #222; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .upload-section { background-color: #212121; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; position: relative; }
        .close-modal { position: absolute; top: 10px; left: 10px; background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; }
        .upload-section input, .upload-section button { display: block; width: 100%; margin-top: 12px; padding: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
        .upload-section input { background-color: #333; color: white; }
        .upload-section button[type="submit"] { background-color: #ff0000; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><span>🎥</span> YouTube Clone</div>
        <div class="search-container">
            <input type="text" id="searchBar" class="search-input" placeholder="ابحث عن فيديو..." oninput="filterVideos()">
        </div>
        <button class="add-video-btn" onclick="document.getElementById('uploadModal').style.display = 'flex'">إضافة فيديو ➕</button>
    </div>

    <div class="modal-overlay" id="uploadModal">
        <div class="upload-section">
            <button class="close-modal" onclick="document.getElementById('uploadModal').style.display = 'none'">✕</button>
            <h3>📤 رفع فيديو إلى السيرفر</h3>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="text" name="videoTitle" placeholder="اكتب عنوان الفيديو هنا..." required>
                <input type="file" name="videoFile" accept="video/*" required>
                <button type="submit">بدء النشر فوراً 🚀</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <div class="video-container" id="videoGrid"></div>
    </div>

    <script>
        let allVideos = [];

        function loadVideos() {
            fetch('/api/videos')
                .then(res => res.json())
                .then(videos => {
                    allVideos = videos || [];
                    renderVideos(allVideos);
                });
        }

        function renderVideos(videosList) {
            const videoGrid = document.getElementById('videoGrid');
            videoGrid.innerHTML = ""; 
            
            if(!videosList || videosList.length === 0) {
                videoGrid.innerHTML = "<p style='color: #aaa; width:100%; text-align:center; margin-top:50px;'>لا توجد فيديوهات! 🚀</p>";
                return;
            }
            
            videosList.forEach(video => {
                const newCard = document.createElement('div');
                newCard.className = 'video-card';
                
                let commentsHtml = "";
                const videoComments = video.comments || [];
                videoComments.forEach(c => { commentsHtml += `<div class="comment-item">💬 ${c}</div>`; });

                newCard.innerHTML = `
                    <video controls><source src="${video.url}" type="video/mp4"></video>
                    <div class="video-title">${video.title}</div>
                    <div class="action-container">
                        <button class="like-btn" onclick="likeVideo('${video.id}')">👍 ${video.likes || 0}</button>
                        <!-- 🗑️ أضفنا زر الحذف السحري هنا -->
                        <button class="delete-btn" onclick="deleteVideo('${video.id}')">حذف 🗑️</button>
                    </div>
                    <div class="comments-section">
                        <div class="comment-input-container">
                            <input type="text" class="comment-input" id="input-${video.id}" placeholder="إضافة تعليق...">
                            <button class="comment-submit-btn" onclick="addComment('${video.id}')">تعليق</button>
                        </div>
                        <div class="comments-list">${commentsHtml || '<span style="color:#555; font-size:11px;">لا توجد تعليقات...</span>'}</div>
                    </div>
                `;
                videoGrid.appendChild(newCard);
            });
        }

        function filterVideos() {
            const searchText = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allVideos.filter(v => v.title && v.title.toLowerCase().includes(searchText));
            renderVideos(filtered);
        }

        function likeVideo(id) {
            fetch(`/api/videos/${id}/like`, { method: 'POST' }).then(() => loadVideos());
        }

        // 🧠 الدالة السحرية لإرسال أمر الحذف للسيرفر وتحديث الصفحة
        function deleteVideo(id) {
            if(confirm("هل أنت متأكد من حذف هذا الفيديو نهائياً؟")) {
                fetch(`/api/videos/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(data => { if(data.success) loadVideos(); });
            }
        }

        function addComment(id) {
            const input = document.getElementById(`input-${id}`);
            if (input.value.trim() === "") return;
            fetch(`/api/videos/${id}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment: input.value })
            }).then(() => { input.value = ""; loadVideos(); });
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
